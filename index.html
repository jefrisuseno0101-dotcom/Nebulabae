<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nebulabae</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:24px;
    font-family:sans-serif;text-align:center;background:#fff;color:#222}
  h1{margin:0 0 28px;font-size:28px}
  a{display:block;width:100%;max-width:340px;background:#76d013;color:#fff;
    font-weight:bold;font-size:18px;padding:18px;border-radius:40px;
    text-decoration:none}
  small{display:block;margin-top:22px;color:#888;font-size:14px;line-height:1.5}
</style>
</head>
<body>
<h1>Nebulabae</h1>
<a id="btn" href="https://sociabuzz.com/nebulabae/tribe">Beri Dukungan</a>
<small>Tidak terbuka? Ketuk ⋮ di kanan atas,<br>lalu pilih "Buka di browser".</small>
<script>
  var tujuan = "sociabuzz.com/nebulabae/tribe";
  var ua = navigator.userAgent;
  var diTikTok = /musical_ly|Bytedance|TikTok/i.test(ua);
  if (!diTikTok) {
    location.replace("https://" + tujuan);
  } else if (/Android/i.test(ua)) {
    document.getElementById("btn").href =
      "intent://" + tujuan +
      "#Intent;scheme=https;package=com.android.chrome;" +
      "S.browser_fallback_url=" + encodeURIComponent("https://" + tujuan) + ";end";
  }
</script>
</body>
</html>
